services:
  postgres:
    image: postgres:16-alpine
    container_name: mentor-apprentice-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD: mentor
      POSTGRES_DB: mentor_apprentice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor -d mentor_apprentice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
